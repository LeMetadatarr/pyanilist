[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyanilist"
dynamic = ["version"]
description = "2 AniList anime/manga catalog bulk harvesters (paginated crawl + ID sweep) grouped on the harvestkit engine."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [
    { name = "JarbasAi", email = "jarbasai@mailfence.com" },
]
keywords = ["anilist", "anime", "manga", "harvestkit", "scraper"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # TODO: switch to "harvestkit>=0.1.0a1" once harvestkit is published to PyPI
    "harvestkit @ git+https://github.com/LeMetadatarr/harvestkit@dev",
    "requests>=2.25",
    "beautifulsoup4>=4.10",
]

[project.optional-dependencies]
stealth = ["unblock_requests"]
hf = ["datasets", "huggingface_hub", "pyarrow"]
test = ["pytest"]

[project.scripts]
pyanilist-harvest = "pyanilist.harvest:main"

[project.urls]
Homepage = "https://github.com/LeMetadatarr/pyanilist"

[tool.setuptools.packages.find]
include = ["pyanilist*"]

[tool.setuptools.dynamic]
version = {attr = "pyanilist.version.__version__"}
